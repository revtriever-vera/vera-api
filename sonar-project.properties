sonar.projectKey=revtriever-vera_vera-api
sonar.projectName=vera-api
sonar.organization=revtriever-vera

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.int-spec.ts
sonar.exclusions=**/*.spec.ts,**/*.int-spec.ts,src/core/database/generated/**

sonar.coverage.exclusions=**/*.module.ts,src/main.ts,src/tracing.ts,src/core/database/generated/**
sonar.javascript.lcov.reportPaths=coverage/merged/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
